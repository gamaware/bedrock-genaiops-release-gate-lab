name: ci

# Pull requests and main run the same checks as `make verify`, with no cloud
# access at all: no id-token permission, no secrets, no role to assume.
# Shared checks come from reusable workflows in gamaware/.github. The verify
# job runs `make verify`, so local runs and CI cannot drift apart.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    env:
      SHELLHARDEN_VERSION: "4.3.2"
      SHELLHARDEN_SHA256: e81e97bc6bccff59b826d3b39328ab19b26721a236440f740ba71754531c7286
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Install shellharden
        run: |
          set -euo pipefail
          archive="shellharden-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/anordal/shellharden/releases/download/v${SHELLHARDEN_VERSION}/${archive}"
          echo "${SHELLHARDEN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" shellharden
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: make verify
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the AWS ruleset
        run: make verify

  lint-docs:
    name: lint-docs
    uses: gamaware/.github/.github/workflows/lint-docs.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    permissions:
      contents: read # checkout

  lint-actions:
    name: lint-actions
    uses: gamaware/.github/.github/workflows/lint-actions.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    permissions:
      contents: read # checkout

  secrets:
    name: secrets
    uses: gamaware/.github/.github/workflows/secrets.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    permissions:
      contents: read # checkout

  security:
    name: security
    uses: gamaware/.github/.github/workflows/security.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    permissions:
      contents: read # checkout
    with:
      checkov-config: .checkov.yaml

  terraform:
    name: terraform
    uses: gamaware/.github/.github/workflows/terraform.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    permissions:
      contents: read # checkout
    with:
      working-directories: '["infra/terraform/release-gate"]'
      terraform-version: 1.14.5
      tflint-version: v0.61.0

  # Builds report/REPORT.pdf in the pinned pandoc/latex image. The arguments
  # match pandoc_args in scripts/build-report.sh, which builds the committed PDF.
  report:
    name: report
    uses: gamaware/.github/.github/workflows/report.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    permissions:
      contents: read # checkout
    with:
      report-path: report/REPORT.md
      pandoc-args: --pdf-engine=xelatex -V geometry:margin=2.2cm -V papersize=a4 --toc --shift-heading-level-by=-1
